<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1440px; overflow: hidden;
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }

  .canvas {
    position: relative; width: 1080px; height: 1440px;
    background: #0B1220;
    background-image:
      linear-gradient(rgba(122,232,201,.05) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(122,232,201,.05) 1.5px, transparent 1.5px);
    background-size: 66px 66px;
    display: flex; flex-direction: column;
    padding: 96px 90px 92px; color: #F2F6FA;
  }
  /* 顶部光晕 */
  .glow {
    position: absolute; top: -260px; right: -220px; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle, rgba(7,135,122,.4), transparent 65%);
  }

  .term {
    position: relative; background: rgba(255,255,255,.055);
    border: 2px solid rgba(158,231,216,.22); border-radius: 24px;
    overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .term .bar {
    display: flex; align-items: center; gap: 12px; padding: 20px 26px;
    background: rgba(255,255,255,.05); border-bottom: 2px solid rgba(158,231,216,.14);
  }
  .dot { width: 22px; height: 22px; border-radius: 50%; }
  .dot.r { background: #FF5F57; } .dot.y { background: #FEBC2E; } .dot.g { background: #28C840; }
  .term .title { margin-left: 14px; font-size: 26px; color: rgba(242,246,250,.5); letter-spacing: 1px; }
  .term .body { padding: 30px 34px 38px; display: flex; flex-direction: column; gap: 20px; }
  .term .line { font-size: 33px; line-height: 1.4; }
  .term .p { color: #7AE8C9; }
  .term .out { color: rgba(242,246,250,.82); }
  .term .warn { color: #FFD24D; }
  .term .caret { display: inline-block; width: 18px; height: 34px; background: #7AE8C9; vertical-align: -6px; }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .l1 { font-size: 92px; font-weight: 600; color: rgba(242,246,250,.92); letter-spacing: 4px; }
  .l2 { font-size: 92px; font-weight: 600; color: rgba(242,246,250,.92); letter-spacing: 4px; }
  .l3 {
    font-size: 94px; font-weight: 700; color: #7AE8C9; letter-spacing: 2px; margin-top: 14px;
    white-space: nowrap;
    text-shadow: 0 0 44px rgba(122,232,201,.35);
  }
  .l3 .u { border-bottom: 12px solid rgba(122,232,201,.45); padding-bottom: 4px; }

  .footer { display: flex; align-items: center; justify-content: space-between; }
  .tags { display: flex; gap: 20px; }
  .tag {
    border: 2.5px solid rgba(158,231,216,.5); color: #9EE7D8; border-radius: 10px;
    padding: 14px 24px; font-size: 32px; letter-spacing: 1px;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; background: #07877A;
    display: flex; align-items: center; justify-content: center;
  }
  .brand .name { font-size: 32px; font-weight: 600; color: rgba(242,246,250,.85); letter-spacing: 2px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="glow"></div>

  <div class="term">
    <div class="bar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="title mono">jobtrace — zsh</div>
    </div>
    <div class="body mono">
      <div class="line"><span class="p">$</span> <span class="out">jobtrace 今天怎么样？</span></div>
      <div class="line out">✓ 新投递 +1 &nbsp;累计 <b style="color:#7AE8C9">100+</b> 家</div>
      <div class="line out">✓ 字节·二面 已约 09-15 10:00</div>
      <div class="line warn">⚠ 腾讯·笔试面经 还没写，快去复盘</div>
      <div class="line"><span class="p">$</span> <span class="caret"></span></div>
    </div>
  </div>

  <div class="main">
    <div class="l1">找不到顺手的</div>
    <div class="l2">投递记录工具——</div>
    <div class="l3">我干脆<span class="u">自己写了</span>一个</div>
  </div>

  <div class="footer">
    <div class="tags mono">
      <div class="tag">#独立开发</div>
      <div class="tag">#免费</div>
    </div>
    <div class="brand">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 64 64">
          <path d="M18 17h28v17c0 11-7 18-18 18-7 0-12-3-15-9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="17" r="4" fill="#dff7aa"/>
        </svg>
      </div>
      <div class="name">JobTrace 职迹</div>
    </div>
  </div>
</div>
</body>
</html>
