openapi: 3.1.0
info:
  title: JobTrace Interview Square API
  version: 1.0.0
paths:
  /api/interviews/public:
    get:
      summary: List completed public interview reviews for an authenticated viewer
      parameters:
        - name: q
          in: query
          description: Case-insensitive partial company-name search
          schema: { type: string, maxLength: 200 }
        - { name: city, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: position,
            in: query,
            schema: { type: string, maxLength: 200 },
          }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [latest, hot], default: latest },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200":
          description: Public interview feed page containing sanitized post bodies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInterviewFeedPage"
        "401":
          description: Authentication required
  /api/interviews/public/{id}:
    get:
      summary: Read one completed public interview review
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Minimal public interview detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicInterviewDetail" }
        "401":
          description: Authentication required
        "404":
          description: Missing, private, incomplete, or unpublished
  /api/interviews/public/{id}/like:
    post:
      summary: Toggle the authenticated viewer's like on a public interview
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Updated engagement counts and viewer like state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicInterviewEngagement" }
        "401": { description: Authentication required }
        "404": { description: Missing or no longer public }
  /api/interviews/public/{id}/comments:
    get:
      summary: List newest comments for a public interview
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Sanitized attributed comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicInterviewComment" }
        "401": { description: Authentication required }
        "404": { description: Missing or no longer public }
    post:
      summary: Add an attributed comment to a public interview
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 1000 }
              additionalProperties: false
      responses:
        "201":
          description: Created comment and updated engagement counts
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PublicInterviewCommentCreation" }
        "400": { description: Invalid comment }
        "401": { description: Authentication required }
        "404": { description: Missing or no longer public }
  /api/interviews/{id}:
    patch:
      summary: Update an owned interview review and its publication state
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInterviewReview" }
      responses:
        "200":
          description: Updated owner detail including sharing fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerInterviewDetail" }
        "400":
          description: Invalid publication state
        "401":
          description: Authentication required
        "404":
          description: Owned interview not found
        "409":
          description: Version conflict

components:
  schemas:
    OwnerQuestion:
      type: object
      required:
        [
          id,
          category,
          question,
          originalAnswer,
          followUpNotes,
          improvedAnswer,
          selfRating,
        ]
      properties:
        id: { type: string, format: uuid }
        category:
          {
            type: string,
            enum: [technical, project, behavioral, system_design, other],
          }
        question: { type: string, minLength: 1, maxLength: 4000 }
        originalAnswer: { type: [string, "null"], maxLength: 10000 }
        followUpNotes: { type: [string, "null"], maxLength: 10000 }
        improvedAnswer: { type: [string, "null"], maxLength: 10000 }
        selfRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
      additionalProperties: false
    OwnerActionItem:
      type: object
      required: [id, content, completed]
      properties:
        id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 1000 }
        completed: { type: boolean }
      additionalProperties: false
    QuestionInput:
      type: object
      required: [question]
      properties:
        id: { type: [string, "null"], format: uuid }
        category:
          {
            type: string,
            enum: [technical, project, behavioral, system_design, other],
          }
        question: { type: string, minLength: 1, maxLength: 4000 }
        originalAnswer: { type: [string, "null"], maxLength: 10000 }
        followUpNotes: { type: [string, "null"], maxLength: 10000 }
        improvedAnswer: { type: [string, "null"], maxLength: 10000 }
        selfRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
      additionalProperties: false
    ActionItemInput:
      type: object
      required: [content]
      properties:
        id: { type: [string, "null"], format: uuid }
        content: { type: string, minLength: 1, maxLength: 1000 }
        completed: { type: boolean }
      additionalProperties: false
    UpdateInterviewReview:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        interviewedOn: { type: string, format: date }
        format: { type: [string, "null"], enum: [online, offline, phone, null] }
        durationMinutes: { type: [integer, "null"], minimum: 1, maximum: 600 }
        interviewerNotes: { type: [string, "null"], maxLength: 2000 }
        roundResult: { type: string, enum: [pending, passed, failed] }
        highlights: { type: [string, "null"], maxLength: 10000 }
        gaps: { type: [string, "null"], maxLength: 10000 }
        status: { type: string, enum: [draft, pending_review, completed] }
        visibility: { type: string, enum: [private, public] }
        authorMode: { type: string, enum: [anonymous, attributed] }
        questions:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/QuestionInput" }
        actionItems:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ActionItemInput" }
      additionalProperties: false
    OwnerInterviewDetail:
      type: object
      required:
        [
          id,
          applicationId,
          stageOccurrenceId,
          companyName,
          positionName,
          stage,
          interviewedOn,
          status,
          roundResult,
          linked,
          questionCount,
          actionCount,
          visibility,
          authorMode,
          publishedAt,
          format,
          durationMinutes,
          interviewerNotes,
          highlights,
          gaps,
          version,
          questions,
          actionItems,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        stageOccurrenceId: { type: [string, "null"], format: uuid }
        companyName: { type: string }
        positionName: { type: string }
        stage: { type: string }
        interviewedOn: { type: string, format: date }
        status: { type: string, enum: [draft, pending_review, completed] }
        roundResult: { type: string, enum: [pending, passed, failed] }
        linked: { type: boolean }
        questionCount: { type: integer, minimum: 0 }
        actionCount: { type: integer, minimum: 0 }
        visibility: { type: string, enum: [private, public] }
        authorMode: { type: string, enum: [anonymous, attributed] }
        publishedAt: { type: [string, "null"], format: date-time }
        format: { type: [string, "null"] }
        durationMinutes: { type: [integer, "null"] }
        interviewerNotes: { type: [string, "null"] }
        highlights: { type: [string, "null"] }
        gaps: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
        questions:
          type: array
          items: { $ref: "#/components/schemas/OwnerQuestion" }
        actionItems:
          type: array
          items: { $ref: "#/components/schemas/OwnerActionItem" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false
    PublicAuthor:
      type: object
      required: [username, image]
      properties:
        username: { type: string }
        image: { type: [string, "null"] }
      additionalProperties: false
    PublicInterviewSummary:
      type: object
      required:
        [
          id,
          companyName,
          positionName,
          city,
          stage,
          interviewedOn,
          publishedAt,
          questionCount,
          author,
          engagement,
        ]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        positionName: { type: string }
        city: { type: [string, "null"] }
        stage: { type: string }
        interviewedOn: { type: string, format: date }
        publishedAt: { type: string, format: date-time }
        questionCount: { type: integer, minimum: 0 }
        author:
          oneOf:
            - { $ref: "#/components/schemas/PublicAuthor" }
            - { type: "null" }
        engagement: { $ref: "#/components/schemas/PublicInterviewEngagement" }
    PublicInterviewEngagement:
      type: object
      required: [likeCount, commentCount, viewCount, likedByViewer]
      properties:
        likeCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }
        viewCount: { type: integer, minimum: 0 }
        likedByViewer: { type: boolean }
      additionalProperties: false
    PublicInterviewComment:
      type: object
      required: [id, content, createdAt, author]
      properties:
        id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/PublicAuthor" }
      additionalProperties: false
    PublicInterviewDetail:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/PublicInterviewSummary" }
        - type: object
          required: [highlights, gaps, questions, recentComments]
          properties:
            highlights: { type: [string, "null"] }
            gaps: { type: [string, "null"] }
            questions:
              type: array
              items:
                type: object
                required:
                  [
                    category,
                    question,
                    originalAnswer,
                    followUpNotes,
                    improvedAnswer,
                  ]
                properties:
                  category: { type: string }
                  question: { type: string }
                  originalAnswer: { type: [string, "null"] }
                  followUpNotes: { type: [string, "null"] }
                  improvedAnswer: { type: [string, "null"] }
                additionalProperties: false
            recentComments:
              type: array
              items: { $ref: "#/components/schemas/PublicInterviewComment" }
    PublicInterviewCommentCreation:
      type: object
      required: [comment, engagement]
      properties:
        comment: { $ref: "#/components/schemas/PublicInterviewComment" }
        engagement: { $ref: "#/components/schemas/PublicInterviewEngagement" }
      additionalProperties: false
    PublicInterviewFeedItem:
      $ref: "#/components/schemas/PublicInterviewDetail"
    PublicInterviewFeedPage:
      type: object
      required: [items, total, limit, nextCursor, facets]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicInterviewFeedItem" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        nextCursor: { type: [string, "null"] }
        facets:
          type: object
          required: [cities, positions]
          properties:
            cities: { type: array, items: { type: string } }
            positions: { type: array, items: { type: string } }
          additionalProperties: false
      additionalProperties: false
