name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobtrace
          POSTGRES_PASSWORD: jobtrace
          POSTGRES_DB: jobtrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtrace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobtrace:jobtrace@127.0.0.1:5432/jobtrace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: python -m compileall scripts tests/performance
      - run: pnpm test
      - run: pnpm db
      - run: pnpm db:test
      - run: pnpm contract
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm performance
